# Lua Cookbook recipe "SQL users".
# Start with: docker compose up -d --wait     Test with: ./test.sh     Stop with: docker compose down -v
name: cookbook-sql-users

services:
  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: cookbook
      MARIADB_ROOT_PASSWORD: cookbook-root
    volumes:
      # Runs 01-schema.sql once, when the database volume is created.
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  nauthilus:
    image: ${NAUTHILUS_IMAGE:-ghcr.io/croessner/nauthilus:v4.2.0}
    depends_on:
      valkey:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      # Optional switch for the Lua JIT (Nauthilus 4.2 and later; earlier releases ignore it).
      NAUTHILUS_AUTH_BACKENDS_LUA_BACKEND_DEFAULT_JIT: ${NAUTHILUS_LUA_JIT:-true}
    ports:
      - "127.0.0.1:28082:8080"
    volumes:
      - ./nauthilus/nauthilus.yml:/etc/nauthilus/nauthilus.yml:ro
      - ./nauthilus/lua:/etc/nauthilus/lua:ro
    healthcheck:
      test: ["CMD", "/usr/app/healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mariadb_data:
