# Nauthilus configuration of the "SQL users" Lua Cookbook recipe.
# Interfaces shown: Lua backend with password check, account listing, and MFA callbacks.

runtime:
  instance_name: "cookbook-sql-users"

  servers:
    http:
      address: "0.0.0.0:8080"

observability:
  log:
    level: "info"
    json: false

storage:
  redis:
    primary:
      address: "valkey:6379"
    database_number: 0
    prefix: "nt:"
    positive_cache_ttl: "1h"
    negative_cache_ttl: "5m"
    # Demo values only. Generate your own random strings for a real installation.
    password_nonce: "cookbookPasswordNonce02"
    encryption_secret: "cookbookEncryption02"

auth:
  backchannel:
    basic_auth:
      enabled: true
      # Scoped credentials: each caller holds only the scopes it needs. Demo passwords only.
      users:
        # The mail server (or curl in test.sh) checks logins.
        - username: "mailserver"
          password: "mailserver-backchannel-secret"
          scopes:
            - "nauthilus:authenticate"
        # The administrator lists accounts and manages TOTP state.
        - username: "admin"
          password: "admin-backchannel-secret"
          scopes:
            - "nauthilus:authenticate"
            - "nauthilus:list_accounts"
            - "nauthilus:mfa_write"

  backends:
    # "cache" answers repeated logins from Redis; "lua" asks backend.lua.
    order:
      - "cache"
      - "lua"

    lua:
      backend:
        default:
          backend_script_path: "/etc/nauthilus/lua/backend.lua"
          # require() finds the bundled helpers and files in /etc/nauthilus/lua.
          package_path: "/usr/app/lua-plugins.d/share/?.lua;/etc/nauthilus/lua/?.lua"
          backend_number_of_workers: 2

        # Which requests use this Lua backend. "account-provider" is the protocol of the account listing
        # (mode=list-accounts) and "idp" the one of MFA changes; without them those calls find no backend.
        search:
          - protocol:
              - "imap"
              - "smtp"
              - "account-provider"
              - "idp"
            cache_name: "sql"
